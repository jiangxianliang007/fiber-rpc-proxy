services:
  fiber-rpc-proxy:
    build: .
    image: fiber-rpc-proxy:local
    restart: always
    environment:
      FIBER_RPC_TOKEN: ${FIBER_RPC_TOKEN:?Set a backend Biscuit token}
    ports:
      - "${FIBER_RPC_PORT:?Set the host RPC port}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
